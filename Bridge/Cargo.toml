[package]
name = "willow_bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rquickjs_playground = { path = "../Vendor/Breeze/rust/rquickjs_playground", default-features = false }
serde_json = "1"
base64 = "0.22"
brotli = "8"
anyhow = "1"
ferrous-opencc = { version = "0.4.0", features = ["japanese-conversion"] }
aes-gcm = "0.10.3"
getrandom = "0.2.17"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
webp = "0.3.1"
md5 = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[patch.crates-io]
rquickjs-sys = { git = "https://github.com/deretame/breeze-rquickjs-sys", rev = "846889c482ee7511f558595384673f55c00c9f4a" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

# macOS 27 会拒绝被 Rust strip 生成的未对齐 proc-macro dylib。
# 构建期依赖不进入 IPA；目标静态库仍使用上面的发布优化。
[profile.release.build-override]
strip = "none"
