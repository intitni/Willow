name: Build and release unsigned iOS app

on:
  push:
    branches: [main]
    tags: ['version/*']
    paths-ignore:
      - 'README.md'
      - 'README.*.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ios-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout with pinned Breeze submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Check repository for signing material
        run: python3 Scripts/check-release-safety.py
      - name: Select Xcode 27.1
        run: |
          test -d /Applications/Xcode_27.1.app
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-apple-ios
      - name: Determine app version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^version/([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo 'Release tags must use version/X.Y.Z.' >&2
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION=0.0.0
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test release safety checks
        run: python3 -m unittest discover -s Tests -p 'test_release_safety.py'
      - name: Run storage and presentation tests
        run: Scripts/test-library-presentation.sh
      - name: Run plugin and presentation tests
        run: Scripts/test-plugin-home.sh
      - name: Run Toast and reader layout tests
        env:
          WILLOW_PACKAGE_TESTS_ONLY: '1'
        run: swift test --disable-sandbox --package-path Core -Xswiftc -disable-sandbox -Xswiftc -DWILLOW_TESTING --filter 'ToastLifecycleTests|ReaderLayoutTests'
      - name: Build unsigned IPA
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/build-unsigned.sh "$APP_VERSION" "$BUILD_NUMBER"
      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Willow-unsigned-${{ github.run_number }}
          path: |
            dist/Willow-${{ steps.version.outputs.value }}-unsigned.ipa
            dist/Willow-${{ steps.version.outputs.value }}-unsigned.ipa.sha256
            dist/Willow-${{ steps.version.outputs.value }}-sources.tar.gz
            dist/Willow-${{ steps.version.outputs.value }}-sources.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/version/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified unsigned artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Willow-unsigned-${{ github.run_number }}
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check ./*.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.ipa ./*.tar.gz ./*.sha256 --clobber
          else
            notes="$RUNNER_TEMP/release-notes.md"
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq '.body' |
              awk '
                /^## New Contributors[[:space:]]*$/ { skip = 1; next }
                /^#+[[:space:]]/ || /^\*\*Full Changelog\*\*:/ { skip = 0 }
                !skip { print }
              ' > "$notes"
            printf '\n附件含未签名 IPA、MPL-2.0 对应源码和 SHA-256 校验文件。[安装与许可说明](https://github.com/%s/blob/%s/README.md)\n' \
              "$GH_REPO" "$RELEASE_TAG" >> "$notes"
            gh release create "$RELEASE_TAG" ./*.ipa ./*.tar.gz ./*.sha256 --verify-tag \
              --title "Willow ${RELEASE_TAG#version/}" --notes-file "$notes"
          fi

  release-note:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-note.yml
